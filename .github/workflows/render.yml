name: Renderizar Video Remotion

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Aceder ao Código
        uses: actions/checkout@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar Ecrã Virtual (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Instalar Dependências do Projeto
        run: npm install

      - name: Renderizar com Remotion (via Xvfb)
        run: xvfb-run --auto-servernum npx remotion render src/Root.tsx Torre42Trailer saida.mp4 --concurrency=1

      - name: Guardar Vídeo Gerado
        uses: actions/upload-artifact@v4
        with:
          name: video-saida
          path: saida.mp4
