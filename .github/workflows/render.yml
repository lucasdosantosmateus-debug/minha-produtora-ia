name: Renderizar Video Remotion

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Aceder ao Código
        uses: actions/checkout@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar Chrome para o Remotion
        uses: browser-actions/setup-chrome@v1

      - name: Instalar Dependências
        run: npm install

      - name: Renderizar com Remotion
        run: npx remotion render src/Root.tsx Torre42Trailer saida.mp4 --concurrency=1

      - name: Guardar Vídeo Gerado
        uses: actions/upload-artifact@v4
        with:
          name: video-saida
          path: saida.mp4
