name: Renderizar Video Remotion

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Aceder ao Código
        uses: actions/checkout@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar Dependências de Sistema para o Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 xvfb

      - name: Instalar Dependências do Projeto
        run: npm install

      - name: Renderizar com Remotion (com Xvfb)
        run: xvfb-run --auto-servernum npx remotion render src/Root.tsx Torre42Trailer saida.mp4 --concurrency=1 --gl=swiftshader

      - name: Guardar Vídeo Gerado
        uses: actions/upload-artifact@v4
        with:
          name: video-saida
          path: saida.mp4
