name: Renderizar Video Remotion

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: remotion/renderer:latest
      options: --user root

    steps:
      - name: Aceder ao Código
        uses: actions/checkout@v3

      - name: Instalar Dependências do Projeto
        run: npm install

      - name: Renderizar com Remotion
        run: npx remotion render src/Root.tsx Torre42Trailer saida.mp4 --concurrency=1 --gl=swiftshader

      - name: Guardar Vídeo Gerado
        uses: actions/upload-artifact@v4
        with:
          name: video-saida
          path: saida.mp4
